name: puente-bsale-walmart

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bsale_sync
      MYSQL_USER: bsale_sync
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Define MYSQL_APP_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    volumes:
      - puente_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - puente_internal

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_ID: puente-bsale-walmart
      APP_SECRET: ${DASHBOARD_PASSWORD:?Define DASHBOARD_PASSWORD en .env}
      DATABASE_URL: mysql://bsale_sync:${MYSQL_APP_PASSWORD}@db:3306/bsale_sync
      SELF_HOSTED: "true"
      PORT: "3000"
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    networks:
      - puente_internal

networks:
  puente_internal:
    driver: bridge

volumes:
  puente_mysql_data:
    name: puente_bsale_walmart_mysql_data
